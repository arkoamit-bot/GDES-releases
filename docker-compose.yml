version: "3.9"

x-app-common: &app-common
  build: .
  env_file:
    - .env
  volumes:
    - bgddr_data:/data
    - static_volume:/app/staticfiles
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_started

services:

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-bgddr}
      MARIADB_USER: ${MYSQL_USER:-bgddr}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "9999:80"
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  app:
    <<: *app-common
    command: >
      sh -c "
      python manage.py migrate --settings=bgddr.settings_prod &&
      python manage.py collectstatic --noinput --settings=bgddr.settings_prod &&
      gunicorn bgddr.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --timeout 120
      --access-logfile -
      --error-logfile -
      "
    ports:
      - "8000:8000"
    restart: unless-stopped

  celery_worker:
    <<: *app-common
    command: celery -A bgddr worker -l INFO --concurrency=4
    restart: unless-stopped

  celery_beat:
    <<: *app-common
    command: celery -A bgddr beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/static:ro
      - bgddr_data:/data:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mariadb_data:
  redis_data:
  static_volume:
  bgddr_data: