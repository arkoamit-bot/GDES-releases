version: "3.9"

x-app-common: &app-common
  build: .
  env_file:
    - .env
  environment:
    - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-bgddr.settings_prod}
  volumes:
    - bgddr_data:/data
    - static_volume:/app/staticfiles
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  mariadb:
    image: mariadb:11
    container_name: bgddr_mariadb
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-bgddr}
      MARIADB_USER: ${MYSQL_USER:-bgddr}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-bgddr_secure_password}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bgddr_phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password}
    ports:
      - "9999:80"
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bgddr_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  app:
    <<: *app-common
    container_name: bgddr_app
    command: >
      gunicorn bgddr.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --timeout 120
      --access-logfile -
      --error-logfile -
    ports:
      - "8000:8000"
    restart: unless-stopped

  celery_worker:
    <<: *app-common
    container_name: bgddr_celery_worker
    command: celery -A bgddr worker -l INFO --concurrency=4
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started

  celery_beat:
    <<: *app-common
    container_name: bgddr_celery_beat
    command: celery -A bgddr beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started

  nginx:
    image: nginx:1.25-alpine
    container_name: bgddr_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/static:ro
      - bgddr_data:/data:ro
    # ADD THIS ENTRYPOINT OVERRIDE TO DISABLE DEFAULT CONF.D
    command: /bin/sh -c "rm -f /etc/nginx/conf.d/* && exec nginx -g 'daemon off;'"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mariadb_data:
  redis_data:
  static_volume:
  bgddr_data: